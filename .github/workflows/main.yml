name: Build

on: [push, pull_request]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            libcairo2-dev \
            libexpat1-dev \
            libicu-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libcurl4-openssl-dev \
            libturbojpeg0-dev \
            libwebp-dev \
            ninja-build \
            meson

      - name: Setup and Build
        run: |
          meson setup build --wrap-mode=nodownload
          meson compile -C build
          ccache --show-stats

  test-macos:
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-

      - name: Install dependencies
        run: |
          brew update
          brew install ccache cairo expat icu4c freetype fontconfig harfbuzz curl jpeg-turbo webp ninja meson pkg-config
      - name: Setup and Build
        run: |
          export PKG_CONFIG_PATH="/opt/homebrew/opt/icu4c/lib/pkgconfig:$PKG_CONFIG_PATH"
          meson setup build --wrap-mode=nodownload
          meson compile -C build
          ccache --show-stats

  build-windows:
    runs-on: windows-latest
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[build:windows]')
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-icu
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-nasm
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            patch
            zip

      - name: Setup and Build
        run: |
          meson setup build \
            --prefix='${{ github.workspace }}/plutobook-win-x64' \
            --buildtype=release \
            --prefer-static \
            --force-fallback-for=cairo,libturbojpeg \
            -Dcpp_link_args='-static -static-libgcc -static-libstdc++ -lwinpthread' \
            -Dcpp_args='-DCAIRO_WIN32_STATIC_BUILD -DCURL_STATICLIB -DU_STATIC_IMPLEMENTATION'
          meson compile -C build
          meson install -C build --strip
          ccache --show-stats

      - name: Create artifact
        run: |
          mkdir -p plutobook-win-x64/{licenses,bin/fonts}
          cp -r /ucrt64/etc/fonts/* plutobook-win-x64/bin/fonts/
          cp -r licenses/* plutobook-win-x64/licenses/
          cp -v CREDITS LICENSE plutobook-win-x64/

          echo '<p>Hello from plutobook</p>' > hello.html
          plutobook-win-x64/bin/html2pdf.exe hello.html hello.pdf
          test -s hello.pdf

          zip -r plutobook-win-x64.zip plutobook-win-x64/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plutobook-win-x64
          path: plutobook-win-x64.zip

  build-macos:
    runs-on: macos-latest
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[build:macos]')
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CMAKE_IGNORE_PREFIX_PATH: /opt/homebrew
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install build tools
        run: brew install meson ninja ccache

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-

      - name: Use system curl
        run: |
          sdk=$(xcrun --show-sdk-path)
          version=$(awk -F'"' '/#define LIBCURL_VERSION /{ print $2 }' "$sdk/usr/include/curl/curlver.h")
          mkdir -p "$RUNNER_TEMP/pkgconfig"
          printf 'Name: libcurl\nDescription: macOS system libcurl\nVersion: %s\nCflags: -I%s/usr/include\nLibs: -lcurl\n' \
            "$version" "$sdk" > "$RUNNER_TEMP/pkgconfig/libcurl.pc"
          cat "$RUNNER_TEMP/pkgconfig/libcurl.pc"

          echo "PKG_CONFIG_LIBDIR=$RUNNER_TEMP/pkgconfig" >> "$GITHUB_ENV"

      - name: Setup and Build
        run: |
          meson wrap update-db
          meson setup build \
            --prefix=/usr/local \
            --buildtype=release \
            --prefer-static \
            --force-fallback-for=expat,icu-uc,freetype2,fontconfig,harfbuzz,cairo,pixman-1,libpng,libturbojpeg,libwebp
          meson compile -C build
          meson install -C build --strip --destdir="$PWD/stage"
          ccache --show-stats

      - name: Create artifact
        run: |
          stage="$PWD/stage/usr/local"
          mkdir -p plutobook-macos-arm64/{lib,include,tools,licenses,etc}
          cp -R "$stage"/include/plutobook* plutobook-macos-arm64/include/
          cp -R "$stage"/etc/fonts plutobook-macos-arm64/etc/
          cp -R licenses/* plutobook-macos-arm64/licenses/
          cp -v CREDITS LICENSE plutobook-macos-arm64/

          lib=libplutobook.dylib
          cp -Lv "$stage/lib/$lib" plutobook-macos-arm64/lib/
          install_name_tool -id "@rpath/$lib" "plutobook-macos-arm64/lib/$lib"

          for tool in html2pdf html2png; do
            cp -v "$stage/bin/$tool" plutobook-macos-arm64/tools/
            old=$(otool -L "plutobook-macos-arm64/tools/$tool" | awk '/libplutobook/ { print $1 }')
            install_name_tool -change "$old" "@rpath/$lib" "plutobook-macos-arm64/tools/$tool"
            install_name_tool -add_rpath @executable_path/../lib "plutobook-macos-arm64/tools/$tool"
          done

          for file in "plutobook-macos-arm64/lib/$lib" plutobook-macos-arm64/tools/*; do
            codesign --force --sign - "$file"
            echo "--- $file"
            otool -L "$file"
            vtool -show-build "$file" | grep -E "platform|minos"
            if otool -L "$file" | tail -n +2 | grep -v -E "^\s+(/usr/lib/|/System/|@rpath/)"; then
              echo "error: $file links a library outside the system"
              exit 1
            fi
            if [ "$(vtool -show-build "$file" | awk '/minos/ { print $2 }')" != "14.0" ]; then
              echo "error: $file does not target macOS 14.0"
              exit 1
            fi
          done

          echo '<p>Hello from plutobook</p>' > hello.html
          FONTCONFIG_PATH="$PWD/plutobook-macos-arm64/etc/fonts" plutobook-macos-arm64/tools/html2pdf hello.html hello.pdf
          test -s hello.pdf

          tar -czvf plutobook-macos-arm64.tar.gz plutobook-macos-arm64/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plutobook-macos-arm64
          path: plutobook-macos-arm64.tar.gz

  build-linux:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[build:linux]')
    container:
      image: almalinux:8
    steps:
      - name: Install build tools
        run: |
          dnf -y install dnf-plugins-core epel-release
          dnf config-manager --set-enabled powertools
          dnf -y install gcc-toolset-14-gcc gcc-toolset-14-gcc-c++ gcc-toolset-14-binutils \
            python3.12 python3.12-pip gperf \
            fontconfig dejavu-sans-fonts tar gzip patch ccache
          python3.12 -m pip install meson ninja patchelf
          echo /opt/rh/gcc-toolset-14/root/usr/bin >> "$GITHUB_PATH"

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-

      - name: Set up environment
        run: |
          mkdir -p "$RUNNER_TEMP/pkgconfig"
          echo "PKG_CONFIG_LIBDIR=$RUNNER_TEMP/pkgconfig" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          echo "CCACHE_MAXSIZE=500M" >> "$GITHUB_ENV"

      - name: Setup and Build
        run: |
          meson wrap update-db
          meson setup build \
            --prefix=/usr \
            --libdir=lib \
            --buildtype=release \
            --prefer-static \
            --force-fallback-for=expat,icu-uc,freetype2,fontconfig,harfbuzz,cairo,pixman-1,libpng,libturbojpeg,libwebp,libcurl,openssl \
            -Dc_args=-fPIC
          meson compile -C build
          meson install -C build --strip --destdir="$PWD/stage"
          ccache --show-stats

      - name: Create artifact
        run: |
          stage="$PWD/stage/usr"
          mkdir -p plutobook-linux-x64/{lib,include,tools,licenses}
          cp -R "$stage"/include/plutobook* plutobook-linux-x64/include/
          cp -R licenses/* plutobook-linux-x64/licenses/
          cp -v CREDITS LICENSE plutobook-linux-x64/
          soname=$(patchelf --print-soname "$stage"/lib/libplutobook.so)
          cp -Lv "$stage"/lib/libplutobook.so plutobook-linux-x64/lib/
          patchelf --set-soname libplutobook.so plutobook-linux-x64/lib/libplutobook.so

          for tool in html2pdf html2png; do
            cp -v "$stage/bin/$tool" plutobook-linux-x64/tools/
            patchelf --replace-needed "$soname" libplutobook.so "plutobook-linux-x64/tools/$tool"
            patchelf --set-rpath '$ORIGIN/../lib' "plutobook-linux-x64/tools/$tool"
          done

          allowed='^(libplutobook\.so|libstdc\+\+\.so\.6|libgcc_s\.so\.1|libm\.so\.6|libc\.so\.6|libpthread\.so\.0|libdl\.so\.2|librt\.so\.1|ld-linux-x86-64\.so\.2)$'
          for file in $(find plutobook-linux-x64/lib plutobook-linux-x64/tools -type f); do
            echo "--- $file"
            needed=$(readelf -d "$file" | awk -F'[][]' '/NEEDED/ { print $2 }')
            echo "$needed"
            if echo "$needed" | grep -v -E "$allowed"; then
              echo "error: $file links a library outside the system"
              exit 1
            fi
            glibc=$(objdump -T "$file" | grep -oE 'GLIBC_[0-9.]+' | sed 's/GLIBC_//' | sort -uV | tail -n 1)
            echo "newest glibc symbol: $glibc"
            if [ "$(printf '%s\n2.28\n' "$glibc" | sort -V | tail -n 1)" != "2.28" ]; then
              echo "error: $file needs glibc newer than 2.28"
              exit 1
            fi
            for abi in GLIBCXX:3.4.25 CXXABI:1.3.11; do
              name=${abi%%:*}; max=${abi#*:}
              newest=$(objdump -T "$file" | grep -oE "${name}_[0-9.]+" | sed "s/${name}_//" | sort -uV | tail -n 1)
              echo "newest $name symbol: ${newest:-none}"
              if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$max" | sort -V | tail -n 1)" != "$max" ]; then
                echo "error: $file needs a libstdc++ newer than the one in RHEL 8 (gcc 8)"
                exit 1
              fi
            done
          done

          echo '<p>Hello from plutobook</p>' > hello.html
          plutobook-linux-x64/tools/html2pdf hello.html hello.pdf
          test -s hello.pdf

          tar -czvf plutobook-linux-x64.tar.gz plutobook-linux-x64/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plutobook-linux-x64
          path: plutobook-linux-x64.tar.gz

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: plutobook-*
          merge-multiple: true

      - name: Prepare Release
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          mv -v plutobook-win-x64.zip "plutobook-${TAG_VERSION}-win-x64.zip"
          mv -v plutobook-linux-x64.tar.gz "plutobook-${TAG_VERSION}-linux-x64.tar.gz"
          mv -v plutobook-macos-arm64.tar.gz "plutobook-${TAG_VERSION}-macos-arm64.tar.gz"

          sed -n "/^## PlutoBook $TAG_VERSION/,/^## PlutoBook /{
            /^## PlutoBook $TAG_VERSION/b
            /^## PlutoBook /b
            p
          }" CHANGELOG.md > RELEASENOTE.md

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: RELEASENOTE.md
          files: |
            plutobook-*.zip
            plutobook-*.tar.gz
