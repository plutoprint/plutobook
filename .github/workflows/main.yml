name: Build

on: [push, pull_request]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ccache \
            libcairo2-dev \
            libexpat1-dev \
            libicu-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libcurl4-openssl-dev \
            libturbojpeg0-dev \
            libwebp-dev \
            ninja-build \
            meson

      - name: Setup and Build
        run: |
          meson setup build --wrap-mode=nodownload
          meson compile -C build
          ccache --show-stats

  test-macos:
    runs-on: macos-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-

      - name: Install dependencies
        run: |
          brew update
          brew install ccache cairo expat icu4c freetype fontconfig harfbuzz curl jpeg-turbo webp ninja meson pkg-config
      - name: Setup and Build
        run: |
          export PKG_CONFIG_PATH="/opt/homebrew/opt/icu4c/lib/pkgconfig:$PKG_CONFIG_PATH"
          meson setup build --wrap-mode=nodownload
          meson compile -C build
          ccache --show-stats

  build-windows:
    runs-on: windows-latest
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[build:windows]')
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-icu
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            zip

      - name: Setup and Build
        run: |
          meson setup build \
            --prefix='${{ github.workspace }}/plutobook-win-x64' \
            --buildtype=release \
            --wrap-mode=nodownload \
            --prefer-static \
            -Dcpp_link_args='-static -static-libgcc -static-libstdc++ -lwinpthread' \
            -Dcpp_args='-DCAIRO_WIN32_STATIC_BUILD -DCURL_STATICLIB -DU_STATIC_IMPLEMENTATION'
          meson compile -C build
          meson install -C build --strip
          ccache --show-stats

      - name: Create artifact
        run: |
          mkdir -p plutobook-win-x64/{licenses,bin/fonts}
          cp -r /ucrt64/etc/fonts/* plutobook-win-x64/bin/fonts/
          cp -r licenses/* plutobook-win-x64/licenses/
          cp -v CREDITS LICENSE plutobook-win-x64/

          zip -r plutobook-win-x64.zip plutobook-win-x64/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plutobook-win-x64
          path: plutobook-win-x64.zip

  build-macos:
    runs-on: macos-latest
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[build:macos]')
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M
      CMAKE_IGNORE_PREFIX_PATH: /opt/homebrew
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install build tools
        run: brew install meson ninja ccache

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: .ccache
          key: ccache-${{ github.job }}-${{ github.sha }}
          restore-keys: ccache-${{ github.job }}-

      - name: Use system curl
        run: |
          sdk=$(xcrun --show-sdk-path)
          version=$(awk -F'"' '/#define LIBCURL_VERSION /{ print $2 }' "$sdk/usr/include/curl/curlver.h")
          mkdir -p "$RUNNER_TEMP/pkgconfig"
          printf 'Name: libcurl\nDescription: macOS system libcurl\nVersion: %s\nCflags: -I%s/usr/include\nLibs: -lcurl\n' \
            "$version" "$sdk" > "$RUNNER_TEMP/pkgconfig/libcurl.pc"
          cat "$RUNNER_TEMP/pkgconfig/libcurl.pc"

          echo "PKG_CONFIG_LIBDIR=$RUNNER_TEMP/pkgconfig" >> "$GITHUB_ENV"

      - name: Setup and Build
        run: |
          meson wrap update-db
          meson setup build \
            --prefix=/usr/local \
            --buildtype=release \
            --prefer-static \
            --force-fallback-for=expat,icu-uc,freetype2,fontconfig,harfbuzz,cairo,pixman-1,libpng,libturbojpeg,libwebp \
            -Dicu:default_library=static \
            -Dpixman:default_library=static \
            -Dlibpng:default_library=static \
            -Dlibjpeg-turbo:default_library=static \
            -Dlibwebp:default_library=static
          meson compile -C build
          meson install -C build --strip --destdir="$PWD/stage"
          ccache --show-stats

      - name: Create artifact
        run: |
          stage="$PWD/stage/usr/local"
          mkdir -p plutobook-macos-arm64/{lib,include,tools,licenses,etc}
          cp -R "$stage"/include/plutobook* plutobook-macos-arm64/include/
          cp -R "$stage"/etc/fonts plutobook-macos-arm64/etc/
          cp -R licenses/* plutobook-macos-arm64/licenses/
          cp -v CREDITS LICENSE plutobook-macos-arm64/

          lib=$(basename "$(otool -D "$stage"/lib/libplutobook.dylib | tail -n 1)")
          cp -v "$stage/lib/$lib" plutobook-macos-arm64/lib/
          ln -s "$lib" plutobook-macos-arm64/lib/libplutobook.dylib
          install_name_tool -id "@rpath/$lib" "plutobook-macos-arm64/lib/$lib"

          for tool in html2pdf html2png; do
            cp -v "$stage/bin/$tool" plutobook-macos-arm64/tools/
            old=$(otool -L "plutobook-macos-arm64/tools/$tool" | awk '/libplutobook/ { print $1 }')
            install_name_tool -change "$old" "@rpath/$lib" "plutobook-macos-arm64/tools/$tool"
            install_name_tool -add_rpath @executable_path/../lib "plutobook-macos-arm64/tools/$tool"
          done

          for file in "plutobook-macos-arm64/lib/$lib" plutobook-macos-arm64/tools/*; do
            codesign --force --sign - "$file"
            echo "--- $file"
            otool -L "$file"
            vtool -show-build "$file" | grep -E "platform|minos"
            if otool -L "$file" | tail -n +2 | grep -v -E "^\s+(/usr/lib/|/System/|@rpath/)"; then
              echo "error: $file links a library outside the system"
              exit 1
            fi
            if [ "$(vtool -show-build "$file" | awk '/minos/ { print $2 }')" != "14.0" ]; then
              echo "error: $file does not target macOS 14.0"
              exit 1
            fi
          done

          echo '<p>Hello from plutobook</p>' > hello.html
          FONTCONFIG_PATH="$PWD/plutobook-macos-arm64/etc/fonts" plutobook-macos-arm64/tools/html2pdf hello.html hello.pdf
          test -s hello.pdf

          tar -czvf plutobook-macos-arm64.tar.gz plutobook-macos-arm64/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plutobook-macos-arm64
          path: plutobook-macos-arm64.tar.gz

  build-docker:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[build:docker]')
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/plutobook-manylinux_2_28_x86_64

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          file: docker/manylinux_2_28_x86_64.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-linux:
    needs: [build-docker]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/plutobook-manylinux_2_28_x86_64@${{ needs.build-docker.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Create artifact
        run: |
          dnf -y install patchelf pax-utils binutils

          mkdir -p plutobook-linux-x64/{lib,include,tools,licenses}
          cp -r /usr/include/plutobook* plutobook-linux-x64/include/
          cp /usr/bin/html2pdf /usr/bin/html2png plutobook-linux-x64/tools/
          cp -r licenses/* plutobook-linux-x64/licenses/
          cp -v CREDITS LICENSE plutobook-linux-x64/

          tools="html2pdf html2png"
          libraries=$( for tool in $tools; do lddtree -l /usr/bin/$tool; done \
            | grep -v '^/usr/bin/' \
            | grep -v -e 'libgcc_s.so.1' \
                      -e 'libresolv.so.2' \
                      -e 'libpthread.so.0' \
                      -e 'libm.so.6' \
                      -e 'libdl.so.2' \
                      -e 'libc.so.6' \
                      -e 'librt.so.1' \
                      -e 'libz.so.1' \
                      -e 'ld-linux-x86-64.so.2' \
                      -e 'libstdc++.so.6' \
            | sort -u)

          for lib in $libraries; do
            cp -v $lib plutobook-linux-x64/lib/
            patchelf --set-rpath '$ORIGIN' plutobook-linux-x64/lib/$(basename $lib)
            strip --strip-unneeded plutobook-linux-x64/lib/$(basename $lib)
          done

          for tool in $tools; do
            patchelf --set-rpath '$ORIGIN/../lib' plutobook-linux-x64/tools/$tool
            strip --strip-unneeded plutobook-linux-x64/tools/$tool
          done

          tar -czhvf plutobook-linux-x64.tar.gz plutobook-linux-x64/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plutobook-linux-x64
          path: plutobook-linux-x64.tar.gz

  release:
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: plutobook-*
          merge-multiple: true

      - name: Prepare Release
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"

          mv -v plutobook-win-x64.zip "plutobook-${TAG_VERSION}-win-x64.zip"
          mv -v plutobook-linux-x64.tar.gz "plutobook-${TAG_VERSION}-linux-x64.tar.gz"
          mv -v plutobook-macos-arm64.tar.gz "plutobook-${TAG_VERSION}-macos-arm64.tar.gz"

          sed -n "/^## PlutoBook $TAG_VERSION/,/^## PlutoBook /{
            /^## PlutoBook $TAG_VERSION/b
            /^## PlutoBook /b
            p
          }" CHANGELOG.md > RELEASENOTE.md

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: RELEASENOTE.md
          files: |
            plutobook-*.zip
            plutobook-*.tar.gz
