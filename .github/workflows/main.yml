name: Build

on: [push, pull_request]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libexpat1-dev \
            libicu-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libharfbuzz-dev \
            libcurl4-openssl-dev \
            libturbojpeg0-dev \
            libwebp-dev \
            ninja-build \
            meson

      - name: Setup and Build
        run: |
          meson setup build --wrap-mode=nodownload
          meson compile -C build

  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ${{ github.job }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install dependencies
        run: |
          brew update
          brew install cairo expat icu4c freetype fontconfig harfbuzz curl jpeg-turbo webp ninja meson pkg-config
      - name: Setup and Build
        run: |
          export PKG_CONFIG_PATH="/opt/homebrew/opt/icu4c/lib/pkgconfig:$PKG_CONFIG_PATH"
          meson setup build --wrap-mode=nodownload
          meson compile -C build

  build-windows:
    runs-on: windows-latest
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[build:windows]')
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-expat
            mingw-w64-ucrt-x86_64-icu
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-cairo
            mingw-w64-ucrt-x86_64-curl-winssl
            mingw-w64-ucrt-x86_64-libjpeg-turbo
            mingw-w64-ucrt-x86_64-libwebp
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gcc
            zip

      - name: Setup and Build
        run: |
          meson setup build \
            --prefix='${{ github.workspace }}/plutobook-win-x64' \
            --buildtype=release \
            --wrap-mode=nodownload \
            --prefer-static \
            -Dcpp_link_args='-static -static-libgcc -static-libstdc++ -lwinpthread' \
            -Dcpp_args='-DCAIRO_WIN32_STATIC_BUILD -DCURL_STATICLIB -DU_STATIC_IMPLEMENTATION'
          meson compile -C build
          meson install -C build --strip

      - name: Create artifact
        run: |
          mkdir -p plutobook-win-x64/{licenses,bin/fonts}
          cp -r /ucrt64/etc/fonts/* plutobook-win-x64/bin/fonts/
          cp -r licenses/* plutobook-win-x64/licenses/
          cp -v CREDITS LICENSE plutobook-win-x64/

          zip -r plutobook-win-x64.zip plutobook-win-x64/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plutobook-win-x64
          path: plutobook-win-x64.zip

  build-docker:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag' || contains(github.event.head_commit.message, '[build:docker]')
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/plutobook-manylinux_2_28_x86_64

      - name: Build and Push Docker image
        uses: docker/build-push-action@v7
        id: push
        with:
          context: .
          file: docker/manylinux_2_28_x86_64.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-linux:
    needs: [build-docker]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/plutobook-manylinux_2_28_x86_64@${{ needs.build-docker.outputs.digest }}

    steps:
      - name: Create artifact
        run: |
          dnf -y install patchelf pax-utils binutils

          mkdir -p plutobook-linux-x64/{lib,lib/fonts,include,tools}
          cp -r /etc/fonts/* plutobook-linux-x64/lib/fonts/
          cp -r /usr/include/plutobook* plutobook-linux-x64/include/
          cp /usr/bin/html2pdf /usr/bin/html2png plutobook-linux-x64/tools/

          tools="html2pdf html2png"
          libraries=$( for tool in $tools; do lddtree -l /usr/bin/$tool; done \
            | grep -v '^/usr/bin/' \
            | grep -v -e 'libgcc_s.so.1' \
                      -e 'libresolv.so.2' \
                      -e 'libpthread.so.0' \
                      -e 'libm.so.6' \
                      -e 'libdl.so.2' \
                      -e 'libc.so.6' \
                      -e 'librt.so.1' \
                      -e 'libz.so.1' \
                      -e 'ld-linux-x86-64.so.2' \
                      -e 'libstdc++.so.6' \
            | sort -u)

          for lib in $libraries; do
            cp -v $lib plutobook-linux-x64/lib/
            patchelf --set-rpath '$ORIGIN' plutobook-linux-x64/lib/$(basename $lib)
            strip --strip-unneeded plutobook-linux-x64/lib/$(basename $lib)
          done

          for tool in $tools; do
            patchelf --set-rpath '$ORIGIN/../lib' plutobook-linux-x64/tools/$tool
            strip --strip-unneeded plutobook-linux-x64/tools/$tool
          done

          tar -czhvf plutobook-linux-x64.tar.gz plutobook-linux-x64/

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: plutobook-linux-x64
          path: plutobook-linux-x64.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: plutobook-*
          merge-multiple: true

      - name: Rename artifacts
        run: |
          for file in plutobook-*.zip; do
            mv -v "$file" "${file%.zip}-${GITHUB_REF_NAME#v}.zip"
          done
      - name: Generate Release Note
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          sed -n "/^## PlutoBook $TAG_VERSION/,/^## PlutoBook /{
            /^## PlutoBook $TAG_VERSION/b
            /^## PlutoBook /b
            p
          }" CHANGELOG.md > RELEASENOTE.md
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: RELEASENOTE.md
          files: plutobook-*.zip
